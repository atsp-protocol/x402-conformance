name: x402 Conformance
description: Safety and conformance checks for x402. No double credit, no credit on timeouts or settlement_pending. Never pays.
author: mgillr
branding:
  icon: shield
  color: green
inputs:
  facilitators:
    description: >-
      Space-separated facilitator base URLs to check with GET /supported only (S0-S4). Nothing is signed, paid or POSTed.
      For a facilitator that needs credentials, set X402C_FACILITATOR_AUTHORIZATION in the step's env from a secret and
      name its host in facilitator-auth-host.
    required: false
    default: ""
  facilitator-auth-host:
    description: >-
      The one facilitator host that receives X402C_FACILITATOR_AUTHORIZATION as its Authorization header. No other host
      ever receives it, and it is never printed.
    required: false
    default: ""
  resources:
    description: >-
      Space-separated paid URLs to check with one unpaid GET each (P1-P7): the 402 answer and its PaymentRequired, on
      any network, V1 or V2. Nothing is paid.
    required: false
    default: ""
  resource-url:
    description: >-
      Your paid route, for example http://127.0.0.1:4020/paid. The action points your server at a facilitator double
      and checks R0-R10 on Solana devnet or Base Sepolia: no content on a /settle timeout, broken answer,
      settlement_pending, failure or duplicate.
    required: false
    default: ""
  binding-cheap-url:
    description: >-
      R11 payment-to-request binding: a paid route cheaper than binding-expensive-url. The probe checks that a payment
      for one is never accepted on the other, and that payTo, asset and network can't be swapped (R11, R11a, R11b).
    required: false
    default: ""
  binding-expensive-url:
    description: A paid route dearer than binding-cheap-url (R11).
    required: false
    default: ""
  binding-method-url:
    description: A paid URL priced differently for GET and POST (R11c).
    required: false
    default: ""
  binding-query-urls:
    description: Two paid URLs that differ only in their query string and are priced differently, comma-separated (R11d).
    required: false
    default: ""
  binding-param-url:
    description: A paid parameterised route with {id} where the parameter goes, e.g. http://127.0.0.1:4020/items/{id}/premium (R11e).
    required: false
    default: ""
  binding-siwx-urls:
    description: >-
      Two paid routes at different prices that declare sign-in-with-x, comma-separated, cheap first, on Base Sepolia
      (R11f). Needs @x402/extensions in your project; nothing is signed with a funded key.
    required: false
    default: ""
  crash:
    description: >-
      "true" also runs R14 after R0-R10: the probe kills your server after /settle succeeds and before the response,
      restarts it and presents the same payment. Needs resource-url, and start (the probe restarts that command) or
      crash-kill and crash-restart.
    required: false
    default: "false"
  crash-kill:
    description: For a server start did not launch, a command that kills it hard and returns once it is gone (R14).
    required: false
    default: ""
  crash-restart:
    description: For a server start did not launch, a command that starts it again in the background and returns (R14).
    required: false
    default: ""
  retry:
    description: >-
      'true' to also check R20 retry double-pay on resource-url: the client times out before /settle answers and
      retries, with a fresh payment under the same payment-identifier id (R20a) and with the same signed payment
      (R20b). The request must be paid once and the retry must get the earlier result.
    required: false
    default: "false"
  start:
    description: >-
      Command that starts your resource server. It receives X402_FACILITATOR_URL (the double) and must use it as its
      facilitator URL. Leave empty if the server is already running against the double's port.
    required: false
    default: ""
  network:
    description: >-
      Which offered network the probe pays on - auto, solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1 or eip155:84532.
    required: false
    default: auto
  port:
    description: Loopback port for the facilitator double.
    required: false
    default: "4402"
  offline:
    description: >-
      Also run the F1-F12 and S5 self-test of the suite against its reference and fault-injected doubles. It checks the suite,
      not your code. On by default in 1.x for compatibility; set "false" to skip it.
    required: false
    default: "true"
  results-dir:
    description: Directory for the results JSON files.
    required: false
    default: x402-conformance
  fail-on-error:
    description: >-
      Fail the job when any error-severity check fails, a requested run produced no results, or the probe found
      nothing it could grade.
    required: false
    default: "true"
  pr-comment:
    description: >-
      "true" posts the result as one sticky pull request comment, updated in place on every run, with a fix link for
      each failed check. Off by default. The calling job needs `permissions: pull-requests: write`; on a fork's pull
      request the token is read-only and the action only warns.
    required: false
    default: "false"
  github-token:
    description: Token for pr-comment. The default job token is enough.
    required: false
    default: ${{ github.token }}
outputs:
  result:
    description: '"pass" when every requested check passed, "unsupported" when the probe found nothing it could grade, otherwise "fail".'
    value: ${{ steps.summary.outputs.result }}
  results-dir:
    description: Directory holding live.json, resource-402.json, resource-server.json and offline.json.
    value: ${{ inputs.results-dir }}
  badge:
    description: >-
      <results-dir>/badge.json, a shields.io endpoint badge (label "x402 conformance", pass n/n, n failing, fail or unsupported). Publish
      it anywhere public and use https://img.shields.io/endpoint?url=<its URL>.
    value: ${{ inputs.results-dir }}/badge.json
  pr-comment:
    description: <results-dir>/pr-comment.md, the markdown posted by pr-comment (written on every run).
    value: ${{ inputs.results-dir }}/pr-comment.md
  sarif:
    description: SARIF 2.1.0 file of failed checks, for github/codeql-action/upload-sarif (GitHub code scanning).
    value: ${{ inputs.results-dir }}/x402-conformance.sarif
  junit:
    description: JUnit XML file with one test case per check, for test-report viewers.
    value: ${{ inputs.results-dir }}/junit.xml
runs:
  using: composite
  steps:
    # No setup-python or setup-node: they would change the Python and Node on PATH for the rest of the caller's job.
    # The Python part needs only the standard library of the runner's python3 (3.10+). The TypeScript probe runs on a
    # pinned, checksum-verified Node in RUNNER_TEMP, called by absolute path; the server under test keeps the caller's.
    - name: Python 3.10+ is available
      shell: bash
      run: |
        python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)' \
          || { echo "::error title=x402 Conformance::python3 3.10 or newer is required on the runner"; exit 1; }
    - name: Live checks S0-S4 (GET /supported only)
      if: inputs.facilitators != ''
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        X402C_TARGETS: ${{ inputs.facilitators }}
        X402C_DIR: ${{ inputs.results-dir }}
        X402C_FACILITATOR_AUTH_HOST: ${{ inputs.facilitator-auth-host }}
      run: |
        mkdir -p "$X402C_DIR"
        # shellcheck disable=SC2086
        python3 -m x402conf live $X402C_TARGETS --evidence "$X402C_DIR/evidence" > "$X402C_DIR/live.json" \
          || rm -f "$X402C_DIR/live.json"
    - name: Resource 402 checks P1-P7 (one unpaid GET per URL)
      if: inputs.resources != ''
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        X402C_TARGETS: ${{ inputs.resources }}
        X402C_DIR: ${{ inputs.results-dir }}
      run: |
        mkdir -p "$X402C_DIR"
        # shellcheck disable=SC2086
        python3 -m x402conf resource $X402C_TARGETS > "$X402C_DIR/resource-402.json" || rm -f "$X402C_DIR/resource-402.json"
    - name: Pinned Node for the probe (not added to PATH)
      if: inputs.resource-url != '' || inputs.binding-cheap-url != '' || inputs.binding-method-url != '' || inputs.binding-query-urls != '' || inputs.binding-param-url != '' || inputs.binding-siwx-urls != ''
      shell: bash
      run: |
        set -euo pipefail
        v=v24.22.0
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  p=linux-x64;    sum=28ea0a438de9a13bd7891fd758eee6c7819ee8af5442dfd8d45bd65e56d4228c ;;
          Linux-aarch64) p=linux-arm64;  sum=b7e7991d5407815adfa74a2a9cd4db683552c8ce32ff4a295c22e972849c3f5d ;;
          Darwin-x86_64) p=darwin-x64;   sum=495e3f273c645f3c4677d438304cdfc701729ea5dec5728f5c8e76a2dece4b91 ;;
          Darwin-arm64)  p=darwin-arm64; sum=6a9724d9b50a5f22b4816cded441b5a8d9ddae546191a5e5b7efa5a5e2ee26d5 ;;
          *) echo "::error title=x402 Conformance::unsupported runner $(uname -s)-$(uname -m)"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/x402c-node"
        mkdir -p "$dir"
        curl -fsSL "https://nodejs.org/dist/$v/node-$v-$p.tar.gz" -o "$dir/node.tgz"
        echo "$sum  $dir/node.tgz" | (sha256sum -c - 2>/dev/null || shasum -a 256 -c -)
        tar -xzf "$dir/node.tgz" -C "$dir" --strip-components=1
        rm "$dir/node.tgz"
    - name: Resource-server checks R0-R11, R14 and R20 (facilitator double on loopback)
      if: inputs.resource-url != '' || inputs.binding-cheap-url != '' || inputs.binding-method-url != '' || inputs.binding-query-urls != '' || inputs.binding-param-url != '' || inputs.binding-siwx-urls != ''
      shell: bash
      env:
        X402C_RESOURCE: ${{ inputs.resource-url }}
        X402C_B_CHEAP: ${{ inputs.binding-cheap-url }}
        X402C_B_DEAR: ${{ inputs.binding-expensive-url }}
        X402C_B_METHOD: ${{ inputs.binding-method-url }}
        X402C_B_QUERY: ${{ inputs.binding-query-urls }}
        X402C_B_PARAM: ${{ inputs.binding-param-url }}
        X402C_B_SIWX: ${{ inputs.binding-siwx-urls }}
        X402C_RETRY: ${{ inputs.retry }}
        X402C_START: ${{ inputs.start }}
        X402C_CRASH: ${{ inputs.crash }}
        X402C_CRASH_KILL: ${{ inputs.crash-kill }}
        X402C_CRASH_RESTART: ${{ inputs.crash-restart }}
        X402C_PORT: ${{ inputs.port }}
        X402C_NETWORK: ${{ inputs.network }}
        X402C_DIR: ${{ inputs.results-dir }}
      run: |
        mkdir -p "$X402C_DIR"
        node_dir="$RUNNER_TEMP/x402c-node"
        # PATH is changed for npm's own processes in this subshell only.
        (cd "$GITHUB_ACTION_PATH/ts" && PATH="$node_dir/bin:$PATH" npm ci --no-audit --no-fund --silent \
          && PATH="$node_dir/bin:$PATH" npm run --silent build) \
          || { echo "::error title=x402 Conformance::building the probe failed"; exit 0; }
        args=(probe --port "$X402C_PORT" --network "$X402C_NETWORK" --out "$X402C_DIR/resource-server.json")
        if [ -n "$X402C_RESOURCE" ]; then args+=(--resource "$X402C_RESOURCE"); fi
        if [ -n "$X402C_B_CHEAP" ]; then args+=(--cheap "$X402C_B_CHEAP" --expensive "$X402C_B_DEAR"); fi
        if [ -n "$X402C_B_METHOD" ]; then args+=(--by-method "$X402C_B_METHOD"); fi
        if [ -n "$X402C_B_QUERY" ]; then args+=(--by-query "$X402C_B_QUERY"); fi
        if [ -n "$X402C_B_PARAM" ]; then args+=(--param "$X402C_B_PARAM"); fi
        if [ -n "$X402C_B_SIWX" ]; then args+=(--siwx-cheap "${X402C_B_SIWX%%,*}" --siwx-expensive "${X402C_B_SIWX#*,}"); fi
        if [ "$X402C_RETRY" = "true" ] && [ -n "$X402C_RESOURCE" ]; then args+=(--retry); fi
        if [ -n "$X402C_START" ]; then args+=(--start "$X402C_START"); fi
        if [ "$X402C_CRASH" = "true" ]; then args+=(--crash); fi
        if [ -n "$X402C_CRASH_KILL" ]; then args+=(--crash-kill "$X402C_CRASH_KILL"); fi
        if [ -n "$X402C_CRASH_RESTART" ]; then args+=(--crash-restart "$X402C_CRASH_RESTART"); fi
        # The exit code is read from the results file by the summary step; a missing file is a failure there.
        "$node_dir/bin/node" "$GITHUB_ACTION_PATH/ts/dist/src/cli.js" "${args[@]}" > /dev/null || true
    - name: Offline self-test F1-F12 and S5
      if: inputs.offline == 'true'
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        X402C_DIR: ${{ inputs.results-dir }}
      run: |
        mkdir -p "$X402C_DIR"
        python3 -m x402conf offline > "$X402C_DIR/offline.json" || true
    - name: SARIF and JUnit reports
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        X402C_DIR: ${{ inputs.results-dir }}
      run: |
        mkdir -p "$X402C_DIR"
        python3 -m x402conf report --dir "$X402C_DIR" --sarif "$X402C_DIR/x402-conformance.sarif" \
          --junit "$X402C_DIR/junit.xml" || true
    - name: Summary
      id: summary
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        X402C_DIR: ${{ inputs.results-dir }}
        X402C_FAIL: ${{ inputs.fail-on-error }}
        X402C_WANT_LIVE: ${{ inputs.facilitators != '' }}
        X402C_WANT_402: ${{ inputs.resources != '' }}
        X402C_WANT_PROBE: ${{ inputs.resource-url != '' || inputs.binding-cheap-url != '' || inputs.binding-method-url != '' || inputs.binding-query-urls != '' || inputs.binding-param-url != '' || inputs.binding-siwx-urls != '' }}
        X402C_WANT_OFFLINE: ${{ inputs.offline == 'true' }}
        X402C_RESOURCE: ${{ inputs.resource-url }}
      run: python3 -c 'import sys; from x402conf import cli; sys.exit(cli.action_summary())'
    - name: Sticky pull request comment (opt-in)
      if: always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        GITHUB_TOKEN: ${{ inputs.github-token }}
        X402C_DIR: ${{ inputs.results-dir }}
      run: |
        if [ -f "$X402C_DIR/pr-comment.md" ]; then python3 -m x402conf pr-comment "$X402C_DIR/pr-comment.md" || true; fi
