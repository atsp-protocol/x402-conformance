# The notify hook for the x402-conformance free run program. Save it in your own repository as
# .github/workflows/x402-conformance-notify.yml. On each published release (only then, not on every commit) it asks
# for a rerun: it comments on your own "Add or update my row" issue in atsp-protocol/x402-conformance, and the run
# queue there picks it up. Reruns are free for six months from your consent; after that your row stays listed with
# its last result, marked stale. Running the suite yourself with the Action stays free and unlimited.
#
# The comment carries only your slug, your repository, the release tag and the version. The queue always runs your
# row's own repository, on loopback with testnet ids: no hosted facilitator, no mainnet, no spend. Full results go
# to you privately first.
#
# Set your slug and your row's issue number below, and add a secret X402_CONFORMANCE_TOKEN: a token of your row's
# contact account that can comment on public issues (a classic token with public_repo scope). Only your row's
# contact or the issue's author can ask for a run.
name: x402-conformance-notify
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SLUG: YOUR-SLUG
      ROW_ISSUE: "0"
      GH_TOKEN: ${{ secrets.X402_CONFORMANCE_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Ask x402-conformance for a rerun of this release
        run: |
          gh issue comment "$ROW_ISSUE" -R atsp-protocol/x402-conformance \
            --body "/x402-conformance run slug=$SLUG repo=$GITHUB_REPOSITORY ref=$TAG version=${TAG#v}"
