[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-conformance"
version = "1.5.0"
description = "Experimental conformance and safety checks for x402 facilitators and resource servers: GET /supported checks, 402 answer checks and fault injection"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Gillespie / Optitransfer" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["x402", "http-402", "pytest", "pytest-plugin", "fastapi", "flask", "agentic-payments", "ai-agents", "micropayments", "stablecoin", "usdc", "solana", "evm",
            "conformance", "fault-injection", "ci", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Framework :: Pytest",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://atsp-protocol.github.io/x402-conformance/"
Repository = "https://github.com/atsp-protocol/x402-conformance"
Documentation = "https://github.com/atsp-protocol/x402-conformance/blob/main/docs/SPEC.md"
Changelog = "https://github.com/atsp-protocol/x402-conformance/blob/main/CHANGELOG.md"
Issues = "https://github.com/atsp-protocol/x402-conformance/issues"

[project.scripts]
x402conf = "x402conf.cli:main"

# The pytest plugin loads only when pytest is installed; the package itself still has no dependencies.
[project.entry-points.pytest11]
x402 = "x402conf.pytest_plugin"

[project.optional-dependencies]
pytest = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x402conf = ["py.typed", "fixtures/*.json", "devnet/node/*.mjs", "devnet/node/package.json", "devnet/node/package-lock.json"]

[tool.ruff]
line-length = 128
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/x402conf"]
