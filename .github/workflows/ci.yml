name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.7.4 mypy==1.13.0 pytest==8.3.5
      - run: ruff check .
      - run: mypy
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: The interdependency map is current and the docs match the code
        run: python3 tools/interdeps.py --check && python3 tools/interdeps.py --drift
      - run: PYTHONPATH=src python -m x402conf offline > /dev/null
      - run: cd evidence/2026-10-20 && sha256sum -c SHA256SUMS
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - run: cd lean && lake build
      - run: python3 tools/lean_axioms.py | tee axioms.json && python3 -c "import json,sys;d=json.load(open('axioms.json'));sys.exit(0 if d['unexpected_axioms']==0 and d['theorems']>=6 else 1)"
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: cd ts && npm ci --no-audit --no-fund && npm test
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - name: Build the core package the MCP server depends on
        run: cd ts && npm ci --no-audit --no-fund && npm run build
      - name: MCP server over stdio, Vercel AI SDK and LangChain tools
        run: cd ts/mcp && npm ci --no-audit --no-fund && npm test
      - name: Registry metadata matches the package
        run: |
          cd ts/mcp
          node -e "const p=require('./package.json'),s=require('./server.json');if(p.mcpName!==s.name||s.packages[0].identifier!==p.name||s.version!==p.version||s.packages[0].version!==p.version||s.description.length>100)process.exit(1)"
          grep -q "mcp-name: $(node -p "require('./server.json').name")" README.md
  pytest-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: The Node probe and the example servers
        run: cd ts && npm ci --no-audit --no-fund && npm run build
      - name: pytest, the stock x402 Python SDK with FastAPI, and this package
        run: pip install pytest==8.3.5 "x402[fastapi,evm,svm]==2.25.0" uvicorn==0.38.0 && pip install .
      - name: Installing the package registers the plugin
        run: cd "$RUNNER_TEMP" && python -m pytest --help | grep -q -- --x402-share
      - name: The x402 fixture, --x402-share, and the probe against the reference, a faulty server and stock FastAPI
        run: X402CONF_REQUIRE_PROBE=1 PYTHONPATH=src python -m unittest discover -v -s tests -p check_pytest_plugin.py
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build the image
        run: docker build -f ts/docker/Dockerfile -t x402-conformance:ci .
      - name: The image carries the MCP registry name from server.json
        run: |
          test "$(docker inspect -f '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' x402-conformance:ci)" \
            = "$(node -p "require('./ts/mcp/server.json').name")"
      - name: Python CLI, Node CLI and help
        run: |
          docker run --rm x402-conformance:ci x402conf offline > /dev/null
          docker run --rm x402-conformance:ci x402conf-svm --version
          docker run --rm x402-conformance:ci help | grep -q X402_RESOURCE_URL
      - name: With no arguments the image is the MCP server on stdio
        run: |
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; sleep 5) \
            | timeout 60 docker run -i --rm x402-conformance:ci > mcp.out
          grep -q '"name":"x402-conformance"' mcp.out
      - name: Example servers to run inside the image
        run: cd ts && npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The GitLab template parses and runs "x402-conformance ci" as gitlab
        run: |
          pip install pyyaml==6.0.2
          python3 -c "import yaml,sys;d=yaml.safe_load(open('ts/ci/gitlab/x402-conformance.gitlab-ci.yml'));j=d['.x402-conformance'];sys.exit(0 if j['script']==['x402-conformance ci'] and j['variables']['X402CONF_VIA']=='gitlab' and d['x402-conformance']['extends']=='.x402-conformance' else 1)"
      - name: The CI run passes the reference server (as GitLab runs it)
        run: |
          mkdir -p pass && docker run --rm -v "$PWD/ts:/srv/ts:ro" -v "$PWD/pass:/work" -e X402CONF_VIA=gitlab \
            -e X402_RESOURCE_URL=http://127.0.0.1:4020/paid -e X402_START="PORT=4020 node /srv/ts/dist/example/server.js" \
            x402-conformance:ci ci
          python3 -c "import json,sys;d=json.load(open('pass/x402-conformance/resource-server.json'));sys.exit(0 if d['via']=='gitlab' and len(d['results'])==11 and d['summary']['failed']==0 else 1)"
          python3 -c "import sys,xml.etree.ElementTree as E;r=E.parse('pass/x402-conformance/junit.xml').getroot();sys.exit(0 if int(r.get('tests'))>=11 and r.get('failures')=='0' else 1)"
      - name: The CI run fails a faulty server, and X402_SHARE writes the anonymised case
        run: |
          mkdir -p fail && set +e && docker run --rm -v "$PWD/ts:/srv/ts:ro" -v "$PWD/fail:/work" -e X402_SHARE=true \
            -e X402_RESOURCE_URL=http://127.0.0.1:4021/paid \
            -e X402_START="PORT=4021 EXAMPLE_FAULT=serve_on_any_settle node /srv/ts/dist/example/server.js" \
            x402-conformance:ci ci 2> fail.err; rc=$?; set -e
          test "$rc" = 1
          grep -q "corpus-case.yml" fail.err
          python3 -c "import json,sys;c=json.load(open('fail/x402-conformance/resource-server.case.json'));sys.exit(0 if c['via']=='docker' and 'R3' in c['failed_ids'] and c['target']=='loopback' else 1)"
  first-run:
    # A1: what a new user types, from the packed packages, timed. Under 60 s each, no wallet, no project, no config.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Pack both packages as they would be published
        run: |
          (cd ts && npm ci --no-audit --no-fund && npm pack --pack-destination "$RUNNER_TEMP")
          python3 -m pip wheel --no-deps -w "$RUNNER_TEMP" .
          pipx --version
      - name: npx one-liner against the bundled mock, under 60 s
        working-directory: ${{ runner.temp }}
        run: |
          t0=$(date +%s)
          npx --yes --package "$PWD/$(ls x402-conformance-svm-*.tgz)" x402conf-svm demo
          t=$(( $(date +%s) - t0 )); echo "npx demo, install included: ${t} s"; test "$t" -lt 60
      - name: pipx one-liner against the bundled mock, under 60 s
        working-directory: ${{ runner.temp }}
        run: |
          t0=$(date +%s)
          pipx run --spec "$PWD/$(ls x402_conformance-*.whl)" x402conf demo
          t=$(( $(date +%s) - t0 )); echo "pipx demo, install included: ${t} s"; test "$t" -lt 60
      - name: A faulty demo exits 1 with fix links
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          out=$(pipx run --spec "$PWD/$(ls x402_conformance-*.whl)" x402conf demo --fault no_fee_payer); code=$?
          echo "$out"; test "$code" = 1 && echo "$out" | grep -q "fix: https://"
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build the example resource servers (@x402/core, @x402/svm, @x402/evm, @x402/express)
        run: cd ts && npm ci --no-audit --no-fund && npm run build
      - run: node --version > node-before.txt
      - name: The action itself, against the example server, with the offline self-test
        id: probe
        uses: ./
        with:
          resource-url: http://127.0.0.1:4020/paid
          start: PORT=4020 node ts/dist/example/server.js
      - run: test "${{ steps.probe.outputs.result }}" = pass
      - name: The action does not change the caller's Node
        run: node --version | diff - node-before.txt
      - name: SARIF and JUnit reports are written and well formed
        run: |
          python3 -c "import json,sys;d=json.load(open('${{ steps.probe.outputs.sarif }}'));sys.exit(0 if d['version']=='2.1.0' and d['runs'][0]['results']==[] else 1)"
          python3 -c "import sys,xml.etree.ElementTree as E;r=E.parse('${{ steps.probe.outputs.junit }}').getroot();sys.exit(0 if int(r.get('tests'))>=21 and r.get('failures')=='0' else 1)"
      - run: python3 -c "import json,sys;d=json.load(open('x402-conformance/resource-server.json'));sys.exit(0 if len(d['results'])==11 and all(r['pass'] for r in d['results']) else 1)"
      - name: The badge and the sticky comment body are written (A2, A5)
        run: |
          python3 -c "import json,sys;d=json.load(open('${{ steps.probe.outputs.badge }}'));sys.exit(0 if d['schemaVersion']==1 and d['color']=='brightgreen' and d['message'].startswith('pass') else 1)"
          head -1 '${{ steps.probe.outputs.pr-comment }}' | grep -qx '<!-- x402-conformance:sticky -->'
      - name: A stock @x402/express server on Base Sepolia passes, R3 included
        id: stock
        uses: ./
        with:
          resource-url: http://127.0.0.1:4022/paid
          start: PORT=4022 EXAMPLE_NETWORK=eip155:84532 node ts/dist/example/express-server.js
          port: "4404"
          offline: "false"
          results-dir: stock
      - run: test "${{ steps.stock.outputs.result }}" = pass
      - name: The action must fail a resource server that serves before settlement
        id: faulty
        uses: ./
        continue-on-error: true
        with:
          resource-url: http://127.0.0.1:4021/paid
          start: PORT=4021 EXAMPLE_FAULT=serve_on_any_settle node ts/dist/example/server.js
          port: "4403"
          offline: "false"
          results-dir: faulty
      - run: test "${{ steps.faulty.outputs.result }}" = fail
      - run: python3 -c "import json,sys;d=json.load(open('faulty/badge.json'));sys.exit(0 if d['color']=='red' else 1)"
      - run: grep -q 'FIXES.md#r' faulty/pr-comment.md
      - name: The faulty server's failures reach the SARIF file
        run: python3 -c "import json,sys;d=json.load(open('faulty/x402-conformance.sarif'));sys.exit(0 if d['runs'][0]['results'] else 1)"
      - name: Fail closed - the double's port is taken, so the probe cannot run
        run: python3 -m http.server 4405 --bind 127.0.0.1 > /dev/null 2>&1 &
      - id: closed
        uses: ./
        continue-on-error: true
        with:
          resource-url: http://127.0.0.1:4023/paid
          start: PORT=4023 node ts/dist/example/server.js
          port: "4405"
          offline: "false"
          results-dir: closed
      - run: test "${{ steps.closed.outputs.result }}" = fail && test "${{ steps.closed.outcome }}" = failure
      - name: R11 binding inputs - the stock @x402/express binding server passes R11-R11e
        id: binding
        uses: ./
        with:
          binding-cheap-url: http://127.0.0.1:4024/cheap
          binding-expensive-url: http://127.0.0.1:4024/expensive
          binding-method-url: http://127.0.0.1:4024/item
          binding-query-urls: http://127.0.0.1:4024/report?tier=basic,http://127.0.0.1:4024/report?tier=pro
          binding-param-url: http://127.0.0.1:4024/items/{id}/premium
          start: PORT=4024 node ts/dist/example/binding-server.js
          port: "4406"
          offline: "false"
          results-dir: binding
      - run: test "${{ steps.binding.outputs.result }}" = pass
      - run: python3 -c "import json,sys;d=json.load(open('binding/resource-server.json'));ids=[r['check'].split()[0] for r in d['results']];sys.exit(0 if ids==['R11','R11a','R11b','R11c','R11d','R11e'] and all(r['pass'] and r['profile'] for r in d['results']) else 1)"
      - name: R11 binding inputs - a server that trusts the client's accepted requirements fails R11a-R11d
        id: binding-faulty
        uses: ./
        continue-on-error: true
        with:
          binding-cheap-url: http://127.0.0.1:4025/cheap
          binding-expensive-url: http://127.0.0.1:4025/expensive
          binding-method-url: http://127.0.0.1:4025/item
          binding-query-urls: http://127.0.0.1:4025/report?tier=basic,http://127.0.0.1:4025/report?tier=pro
          start: PORT=4025 BINDING_FAULT=trust_client node ts/dist/example/binding-server.js
          port: "4407"
          offline: "false"
          results-dir: binding-faulty
      - run: test "${{ steps.binding-faulty.outputs.result }}" = fail
      - name: The binding failures reach the SARIF file
        run: python3 -c "import json,sys;d=json.load(open('binding-faulty/x402-conformance.sarif'));ids={r['ruleId'] for r in d['runs'][0]['results']};print(sorted(ids));sys.exit(0 if {'R11a','R11b','R11c','R11d'}<=ids else 1)"
      - name: R11f input - a sign-in-with-x server that records the settled route passes
        id: siwx
        uses: ./
        with:
          binding-siwx-urls: http://127.0.0.1:4026/siwx/cheap,http://127.0.0.1:4026/siwx/expensive
          start: PORT=4026 SIWX_MODE=fixed node ts/dist/example/binding-server.js
          port: "4408"
          offline: "false"
          results-dir: siwx
      - run: test "${{ steps.siwx.outputs.result }}" = pass
      - name: R11f input - the stock @x402/extensions settle hook fails (x402#3838)
        id: siwx-stock
        uses: ./
        continue-on-error: true
        with:
          binding-siwx-urls: http://127.0.0.1:4027/siwx/cheap,http://127.0.0.1:4027/siwx/expensive
          start: PORT=4027 SIWX_MODE=stock node ts/dist/example/binding-server.js
          port: "4409"
          offline: "false"
          results-dir: siwx-stock
      - run: test "${{ steps.siwx-stock.outputs.result }}" = fail
      - name: R14 input - a server with a durable idempotency record survives a crash between /settle and the response
        id: crash
        uses: ./
        with:
          resource-url: http://127.0.0.1:4028/paid
          start: PORT=4028 CRASH_STORE=${{ runner.temp }}/r14-store.json node ts/dist/example/crash-server.js
          crash: "true"
          port: "4410"
          offline: "false"
          results-dir: crash
      - run: test "${{ steps.crash.outputs.result }}" = pass
      - run: python3 -c "import json,sys;d=json.load(open('crash/resource-server.json'));r=d['results'];sys.exit(0 if len(r)==12 and r[-1]['check'].startswith('R14') and all(x['pass'] for x in r) else 1)"
      - name: R14 input - a server whose record is in memory only settles again after the restart and fails
        id: crash-faulty
        uses: ./
        continue-on-error: true
        with:
          resource-url: http://127.0.0.1:4029/paid
          start: PORT=4029 CRASH_FAULT=memory_record node ts/dist/example/crash-server.js
          crash: "true"
          port: "4411"
          offline: "false"
          results-dir: crash-faulty
      - run: test "${{ steps.crash-faulty.outputs.result }}" = fail
      - name: The R14 failure reaches the SARIF and JUnit files with its fix link
        run: |
          python3 -c "import json,sys;d=json.load(open('crash-faulty/x402-conformance.sarif'));ids={r['ruleId'] for r in d['runs'][0]['results']};print(sorted(ids));sys.exit(0 if ids=={'R14'} else 1)"
          grep -q 'R14' crash-faulty/junit.xml && grep -q 'FIXES.md#r14' crash-faulty/pr-comment.md
  vv:
    needs: [lint, test, lean, ts, first-run, mcp, pytest-plugin, docker, action]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.7.4 mypy==1.13.0 pytest==8.3.5
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: Owner signature state
        run: node tools/verify-sig.mjs || [ $? -eq 3 ]
      - name: Proofline V&V (fails on a claimed-but-unmet task, out-of-scope files or a bad signature)
        run: python3 tools/vv.py verify --receipts vv/receipts ${{ github.event_name == 'pull_request' && '--pre-merge' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vv-receipt
          path: vv/receipts/
          retention-days: 90
