name: impl-matrix
# The implementation matrix (XC-19): the probe against stock example servers at pinned SDK versions, one job per row
# of evidence/impl-matrix/. Each job rebuilds its row on loopback behind the facilitator double, compares the summary
# with the committed run.json, and uploads the fresh run with its hashes. Nothing here contacts a third party.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  row:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        row: [express-2.28.0, express-2.27.0, hono-2.28.0, fastapi-2.25.0, flask-2.25.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the probe and the stock TypeScript examples
        run: cd ts && npm ci --no-audit --no-fund && npx tsc -p .
      - name: The stock Python SDK, pinned
        if: startsWith(matrix.row, 'fastapi') || startsWith(matrix.row, 'flask')
        run: pip install "x402[fastapi,flask,evm,svm]==2.25.0" uvicorn==0.38.0 flask==3.1.3
      - name: The stock Express example on the 2.27.0 packages, in a project of their own
        if: matrix.row == 'express-2.27.0'
        run: |
          mkdir -p "$RUNNER_TEMP/x402-2.27.0" && cd "$RUNNER_TEMP/x402-2.27.0"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @x402/express@2.27.0 @x402/core@2.27.0 @x402/svm@2.27.0 @x402/evm@2.27.0 express@4.22.3
          cp "$GITHUB_WORKSPACE/ts/dist/example/express-server.js" express-server.mjs
      - name: Probe the row
        run: |
          case "${{ matrix.row }}" in
            express-2.28.0) port=47501; start="PORT=$port node ts/dist/example/express-server.js" ;;
            express-2.27.0) port=47505; start="cd $RUNNER_TEMP/x402-2.27.0 && PORT=$port node express-server.mjs" ;;
            hono-2.28.0)    port=47502; start="PORT=$port node ts/dist/example/hono-server.js" ;;
            fastapi-2.25.0) port=47503; start="PORT=$port python examples/python/fastapi_server.py" ;;
            flask-2.25.0)   port=47504; start="PORT=$port python examples/python/flask_server.py" ;;
          esac
          mkdir -p "$RUNNER_TEMP/row"
          node ts/dist/src/cli.js probe --resource "http://127.0.0.1:$port/paid" --port 0 --start "$start" --out "$RUNNER_TEMP/row/run.json"
      - name: The fresh run agrees with the committed row
        run: |
          python3 - "$RUNNER_TEMP/row/run.json" "evidence/impl-matrix/${{ matrix.row }}/run.json" <<'EOF'
          import json, sys
          fresh, kept = (json.load(open(p))["summary"] for p in sys.argv[1:])
          print("fresh:", fresh); print("committed:", kept)
          sys.exit(0 if (fresh["checks"], fresh["failed_ids"]) == (kept["checks"], kept["failed_ids"]) else 1)
          EOF
      - name: Hash the fresh run
        run: cd "$RUNNER_TEMP/row" && sha256sum run.json > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: impl-matrix-${{ matrix.row }}
          path: ${{ runner.temp }}/row
