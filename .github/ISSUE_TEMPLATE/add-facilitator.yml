name: Add my facilitator to the results
description: Ask for your facilitator to be checked and listed in the results
title: "Results: add <facilitator name>"
labels: [results]
body:
  - type: markdown
    attributes:
      value: >-
        I check public facilitators with one `GET /supported` (S0-S4) and list the results with the raw body and its hash.
        The F checks over real `/verify` and `/settle` run on Solana devnet only with your written permission.
  - type: input
    id: url
    attributes: { label: Facilitator base URL, placeholder: "https://facilitator.example.com" }
    validations: { required: true }
  - type: input
    id: operator
    attributes: { label: Operator (company or project) }
    validations: { required: true }
  - type: dropdown
    id: devnet
    attributes:
      label: May I also run the devnet safety checks (F1-F6) against your facilitator?
      options: ["No, GET /supported only", "Yes, on Solana devnet, and I'm authorised to give that permission"]
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: "Anything I should know (credentials needed for /supported, networks, rate limits)" }
